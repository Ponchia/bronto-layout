version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      eslint:
        patterns: ['eslint', '@eslint/js', 'typescript-eslint']
        update-types: ['minor', 'patch']
    # ESLint 10 and its config must stay on compatible majors.
    # Group routine lint updates; review a future major migration together.
    ignore:
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 failed npm peer resolution against typescript-eslint 8.71.
      # Upgrade both together only after upstream declares compatibility.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
