version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # ESLint's 9.x runtime and config must be upgraded as a pair.
    # A standalone @eslint/js 10 major PR failed both Node/Chromium gates.
    ignore:
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 failed npm peer resolution against typescript-eslint 8.71.
      # Upgrade both together only after upstream declares compatibility.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
