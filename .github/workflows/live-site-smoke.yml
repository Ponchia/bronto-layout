name: Live-site CLI smoke

# Diagnostic only. External websites change independently of this repository,
# so failures here do not block normal library contributions.
on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Run the multilingual route suite with the CLI batch command'
        type: boolean
        default: false
      css_breakpoints:
        description: 'Also scan CSS media-query boundaries on the portfolio and Sense6'
        type: boolean
        default: false
      css_sources:
        description: 'Inspect matched author CSS rules on the deployed portfolio and Sense6'
        type: boolean
        default: false
      layout_shifts:
        description: 'Measure lab loading layout shifts on the portfolio and Sense6'
        type: boolean
        default: false
      geometry_stability:
        description: 'Check sampled DOM geometry quiet windows on selected first-party pages'
        type: boolean
        default: false
      automatic_audit:
        description: 'Run evidence-first zero-contract audits of first-party websites'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bronto-layout-live-site-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install and compile the CLI
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Validate the live-site contracts offline
        run: |
          for contract in examples/personal-site.json examples/sense6-gallery.json examples/sense6-ar.json examples/sense6-learn.json; do
            node bin/bronto-layout.mjs validate --spec "$contract"
          done
      - name: Audit only the known first-party websites
        id: audit
        if: ${{ !inputs.batch }}
        env:
          BRONTO_CHROME_NO_SANDBOX: '1'
        run: |
          # The runner is an ephemeral, isolated CI machine. Chrome sandboxing
          # remains enabled by default everywhere else.
          mkdir -p reports logs
          set +e  # Collect failures from every site rather than stopping after the first.
          failures=0
          for contract in examples/personal-site.json examples/sense6-gallery.json examples/sense6-ar.json examples/sense6-learn.json; do
            name="$(basename "$contract" .json)"
            echo "::group::${name}"
            extra=()
            if [ "$name" = "sense6-ar" ]; then extra+=(--locale ar); fi
            node bin/bronto-layout.mjs check --spec "$contract" --ready-selector body --settle 600 --timeout 30000 "${extra[@]}" --report "reports/${name}.json" > "logs/${name}.txt" 2>&1
            status=$?
            cat "logs/${name}.txt"
            printf '\nCLI exit status: %s\n' "$status"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
              echo "::warning::${name}: Bronto Layout exited ${status}; inspect the report and log artifact"
            fi
          done
          printf '%s\n' "Contracts with failures or navigation errors: ${failures}/4"
          set -e
          test "$failures" -eq 0
      - name: Audit the first-party multilingual batch
        if: ${{ inputs.batch }}
        env:
          BRONTO_CHROME_NO_SANDBOX: '1'
        run: |
          mkdir -p reports logs
          node bin/bronto-layout.mjs batch --manifest examples/live-sites-batch.json \
            --json --compact --ready-selector body --settle 600 --timeout 30000 \
            --report reports/batch.json > logs/batch.txt 2>&1
          cat logs/batch.txt
      - name: Audit CSS breakpoints on selected first-party sites
        if: ${{ inputs.css_breakpoints }}
        env:
          BRONTO_CHROME_NO_SANDBOX: '1'
        run: |
          # Opt-in only: additional navigations and viewport samples can be slow.
          mkdir -p reports logs
          set +e
          failures=0
          for name in personal-site sense6-gallery sense6-ar; do
            echo "::group::CSS breakpoint scan: ${name}"
            extra=()
            if [ "$name" = "sense6-ar" ]; then extra+=(--locale ar); fi
            node bin/bronto-layout.mjs scan --spec "examples/${name}.json" \
              --scan 320:1280:240 --css-breakpoints --max-samples 100 \
              --ready-selector body --settle 600 --timeout 30000 "${extra[@]}" \
              --report "reports/css-${name}.json" > "logs/css-${name}.txt" 2>&1
            status=$?
            cat "logs/css-${name}.txt"
            printf '\nCLI exit status: %s\n' "$status"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
              echo "::warning::CSS breakpoint scan ${name} exited $status; inspect the report artifact"
            fi
          done
          echo "CSS breakpoint contracts with failures or navigation errors: $failures/3"
          set -e
          test "$failures" -eq 0
      - name: Inspect live first-party CSS source hints
        if: ${{ inputs.css_sources }}
        env:
          BRONTO_CHROME_NO_SANDBOX: '1'
        run: |
          # Run only on this ephemeral CI machine with our known public sites.
          # On a developer machine keep Chrome sandboxed for arbitrary pages.
          mkdir -p reports logs
          for name in personal-site sense6-gallery; do
            if [ "$name" = "personal-site" ]; then
              url="https://brontolotto.observer/"
              selector=".site-header"
            else
              url="https://sense6.net/en/"
              selector=".gallery-hero"
            fi
            echo "::group::CSS source inspection: $name"
            node bin/bronto-layout.mjs inspect --url "$url" \
              --selector "target=$selector" --ready-selector "$selector" \
              --width 375 --settle 600 --timeout 30000 \
              --css-sources --json --report "reports/css-source-$name.json" \
              > "logs/css-source-$name.txt" 2>&1
            # The inspect result must contain actual matched author rules,
            # not merely a successful page navigation with an empty selector.
            node -e '
              const fs = require("node:fs");
              const doc = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const alias = doc.cssSources?.[0]?.aliases?.[0];
              const matched = alias?.elements?.flatMap(x => x.status === "ok" ? x.rules : []) ?? [];
              if (doc.mode !== "inspect" || !alias || alias.visibleCount === 0 || matched.length === 0) {
                console.error("No verified CSS source evidence for " + process.argv[2]);
                process.exit(1);
              }
              console.log(process.argv[2] + ": " + alias.visibleCount + " visible elements, " +
                matched.length + " matched author rules (" +
                matched.filter(x => x.sourceKind === "external-stylesheet").length +
                " external stylesheets)");
            ' "reports/css-source-$name.json" "$name"
            echo "::endgroup::"
          done
      - name: Observe loading layout shifts on first-party pages
        if: ${{ inputs.layout_shifts }}
        env:
          BRONTO_CHROME_NO_SANDBOX: '1'
        run: |
          # Lab-only observations; no hard-coded Web Vitals score budget.
          mkdir -p reports logs
          for name in personal-site sense6-gallery sense6-ar sense6-learn; do
            case "$name" in
              personal-site) url="https://brontolotto.observer/" ;;
              sense6-gallery) url="https://sense6.net/en/" ;;
              sense6-ar) url="https://sense6.net/ar/" ;;
              sense6-learn) url="https://sense6.net/en/learn/" ;;
            esac
            extra=()
            if [ "$name" = "sense6-ar" ]; then extra+=(--locale ar); fi
            echo "::group::Loading layout shifts: $name"
            node bin/bronto-layout.mjs inspect --url "$url" --selector page=body \
              --widths 375,768,1280 --ready-selector body --settle 1300 \
              --timeout 30000 --layout-shifts --json "${extra[@]}" \
              --report "reports/shifts-$name.json" > "logs/shifts-$name.txt" 2>&1
            node - "$name" "reports/shifts-$name.json" <<'NODE'
          const fs = require('node:fs');
          const name = process.argv[2];
          const file = process.argv[3];
          const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
          const snapshots = doc.snapshots ?? [];
          if (doc.mode !== 'inspect' || snapshots.length !== 3 ||
              snapshots.some(x => x.layoutShifts?.supported !== true)) {
            console.error('Lab shift measurements missing or incomplete for ' + name);
            process.exit(1);
          }
          console.log(name + ': ' + snapshots.map(x =>
            x.viewport.width + 'px=' + x.layoutShifts.maxSessionScore.toFixed(6) +
            ' (' + x.layoutShifts.shiftCount + ' non-input shifts)').join(', '));
          NODE
            echo "::endgroup::"
          done
      - name: Audit DOM geometry quiet windows on first-party pages
        if: ${{ inputs.geometry_stability }}
        env:
          BRONTO_CHROME_NO_SANDBOX: '1'
        run: |
          # Diagnostic only. A quiet window does not prove that a site never
          # moves later or that all visual styling has been checked.
          mkdir -p reports logs
          for name in personal-site sense6-gallery sense6-ar; do
            case "$name" in
              personal-site)
                url="https://brontolotto.observer/"
                selector="site=.site"
                ;;
              sense6-gallery)
                url="https://sense6.net/en/"
                selector="gallery=.gallery-hero"
                ;;
              sense6-ar)
                url="https://sense6.net/ar/"
                selector="gallery=.gallery-hero"
                ;;
            esac
            extra=()
            if [ "$name" = "sense6-ar" ]; then extra+=(--locale ar); fi
            echo "::group::Geometry quiet window: $name"
            node bin/bronto-layout.mjs inspect --url "$url" --selector "$selector" \
              --widths 375,768,1280 --ready-selector body --settle 600 \
              --stable-for 350 --timeout 30000 --json "${extra[@]}" \
              --report "reports/geometry-$name.json" > "logs/geometry-$name.txt" 2>&1
            node - "$name" "reports/geometry-$name.json" <<'NODE'
          const fs = require('node:fs');
          const name = process.argv[2];
          const doc = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const samples = doc.snapshots ?? [];
          if (doc.mode !== 'inspect' || samples.length !== 3 ||
              samples.some(s => s.stabilization?.status !== 'stable' ||
                s.stabilization?.stableForMs !== 350 ||
                s.stabilization?.samples < 3)) {
            console.error('Missing measured DOM geometry quiet window for ' + name);
            process.exit(1);
          }
          console.log(name + ': ' + samples.map(s =>
            s.viewport.width + 'px stable after ' + s.stabilization.waitedMs +
            'ms / ' + s.stabilization.samples + ' samples').join(', '));
          NODE
            echo "::endgroup::"
          done
      - name: Run zero-contract responsive audits of first-party sites
        if: ${{ inputs.automatic_audit }}
        env:
          BRONTO_CHROME_NO_SANDBOX: '1'
        run: |
          # Manual-only CI job: public first-party URLs, isolated runner.
          # A measured failure is not necessarily an unwanted design choice.
          mkdir -p reports logs
          failures=0
          for name in personal-site sense6-gallery sense6-ar sense6-learn; do
            case "$name" in
              personal-site) url="https://brontolotto.observer/" ;;
              sense6-gallery) url="https://sense6.net/en/" ;;
              sense6-ar) url="https://sense6.net/ar/" ;;
              sense6-learn) url="https://sense6.net/en/learn/" ;;
            esac
            extra=()
            if [ "$name" = "sense6-ar" ]; then extra+=(--locale ar); fi
            echo "::group::Zero-contract audit: $name"
            set +e
            node bin/bronto-layout.mjs audit --url "$url" \
              --widths 320,375,768,1280 --ready-selector body \
              --settle 650 --timeout 30000 --json --compact "${extra[@]}" \
              --report "reports/auto-audit-$name.json" > "logs/auto-audit-$name.txt" 2>&1
            status=$?
            set -e
            node - "$name" "reports/auto-audit-$name.json" <<'NODE'
          const fs = require('node:fs');
          const name = process.argv[2];
          const doc = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const result = doc.summary ?? {};
          if (doc.mode !== 'audit' || result.viewports !== 4) {
            console.error('Missing or incomplete automatic layout audit: ' + name);
            process.exit(1);
          }
          console.log(name + ': ' + result.measuredIssues + ' measured issues, ' +
            result.reviewWarnings + ' review warnings, ' +
            result.incompleteViewports + ' incomplete viewports, ' +
            result.visitedElements + ' DOM elements traversed');
          NODE
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
              echo "::warning::Automatic audit $name exited $status; inspect retained report"
            fi
            echo "::endgroup::"
          done
          echo "Sites with measured issues or incomplete audits: $failures/4"
          test "$failures" -eq 0
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bronto-layout-live-site-reports
          path: |
            reports/
            logs/
          if-no-files-found: warn
          retention-days: 7
