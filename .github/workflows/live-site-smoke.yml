name: Live-site CLI smoke

# Diagnostic only. External websites change independently of this repository,
# so failures here do not block normal library contributions.
on:
  workflow_dispatch:
    inputs:
      css_breakpoints:
        description: 'Also scan CSS media-query boundaries on the portfolio and Sense6'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bronto-layout-live-site-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install and compile the CLI
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Validate the live-site contracts offline
        run: |
          for contract in examples/personal-site.json examples/sense6-gallery.json examples/sense6-ar.json examples/sense6-learn.json; do
            node bin/bronto-layout.mjs validate --spec "$contract"
          done
      - name: Audit only the known first-party websites
        id: audit
        env:
          BRONTO_CHROME_NO_SANDBOX: '1'
        run: |
          # The runner is an ephemeral, isolated CI machine. Chrome sandboxing
          # remains enabled by default everywhere else.
          mkdir -p reports logs
          set +e  # Collect failures from every site rather than stopping after the first.
          failures=0
          for contract in examples/personal-site.json examples/sense6-gallery.json examples/sense6-ar.json examples/sense6-learn.json; do
            name="$(basename "$contract" .json)"
            echo "::group::${name}"
            extra=()
            if [ "$name" = "sense6-ar" ]; then extra+=(--locale ar); fi
            node bin/bronto-layout.mjs check --spec "$contract" --ready-selector body --settle 600 --timeout 30000 "${extra[@]}" --report "reports/${name}.json" > "logs/${name}.txt" 2>&1
            status=$?
            cat "logs/${name}.txt"
            printf '\nCLI exit status: %s\n' "$status"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
              echo "::warning::${name}: Bronto Layout exited ${status}; inspect the report and log artifact"
            fi
          done
          printf '%s\n' "Contracts with failures or navigation errors: ${failures}/4"
          set -e
          test "$failures" -eq 0
      - name: Audit CSS breakpoints on selected first-party sites
        if: ${{ inputs.css_breakpoints }}
        env:
          BRONTO_CHROME_NO_SANDBOX: '1'
        run: |
          # Opt-in only: additional navigations and viewport samples can be slow.
          mkdir -p reports logs
          set +e
          failures=0
          for name in personal-site sense6-gallery sense6-ar; do
            echo "::group::CSS breakpoint scan: ${name}"
            extra=()
            if [ "$name" = "sense6-ar" ]; then extra+=(--locale ar); fi
            node bin/bronto-layout.mjs scan --spec "examples/${name}.json" \
              --scan 320:1280:240 --css-breakpoints --max-samples 100 \
              --ready-selector body --settle 600 --timeout 30000 "${extra[@]}" \
              --report "reports/css-${name}.json" > "logs/css-${name}.txt" 2>&1
            status=$?
            cat "logs/css-${name}.txt"
            printf '\nCLI exit status: %s\n' "$status"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
              echo "::warning::CSS breakpoint scan ${name} exited $status; inspect the report artifact"
            fi
          done
          echo "CSS breakpoint contracts with failures or navigation errors: $failures/3"
          set -e
          test "$failures" -eq 0
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bronto-layout-live-site-reports
          path: |
            reports/
            logs/
          if-no-files-found: warn
          retention-days: 7
