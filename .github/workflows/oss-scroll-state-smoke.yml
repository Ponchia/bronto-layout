# Manual, fixed-URL scroll-state study on public Docusaurus and Vite docs.
# No arbitrary URLs, injected browser code, authentication, or sandbox bypass.
name: External OSS deep-scroll states

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-deep-scroll-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deep-scroll:
    name: Verify fixed documentation scroll targets
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Build and validate reviewed scroll-state contracts
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node --test tests/oss-scroll-states.test.mjs
          for spec in benchmarks/oss-scroll/*.json; do
            node bin/bronto-layout.mjs validate --spec "$spec" --json >/dev/null
          done
          node scripts/run-oss-deep-scroll.mjs --plan

      - name: Require sandboxed Chrome startup
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          test -x "$CHROME_PATH"
          node bin/bronto-layout.mjs doctor --verify-launch --json

      - name: Measure actual browser scroll offsets and capture proof
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          node scripts/run-oss-deep-scroll.mjs --out "reports/oss-deep-scroll-$GITHUB_RUN_ID"

      - name: Upload temporary, checksum-verified evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bronto-layout-oss-deep-scroll
          path: reports/oss-deep-scroll-*/
          if-no-files-found: warn
          retention-days: 7
