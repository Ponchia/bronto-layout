name: First-party layout pulse

# The diagnostic is independent of package PR gates and never touches private
# sessions, browser actions or pages. Scheduled results may be red when deployed sites change;
# this is an observation to investigate, not proof of a source regression.
on:
  schedule:
    - cron: '23 6 * * 1' # Weekly Monday, UTC. Avoid :00 GitHub scheduler contention.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bronto-layout-first-party-pulse
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - name: Build source-pinned tool and check six target contracts offline
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node scripts/first-party-pulse.mjs --plan
      - name: Prove sandboxed Chromium can launch before public navigation
        env:
          BRONTO_CHROME_NO_SANDBOX: '0'
        run: |
          node bin/bronto-layout.mjs doctor --verify-launch --json > "$RUNNER_TEMP/bronto-pulse-browser-preflight.json"
      - name: Check first-party public routes and emit sanitized findings only
        env:
          BRONTO_CHROME_NO_SANDBOX: '0'
        run: node scripts/first-party-pulse.mjs --run
      - name: Retain compact longitudinal metadata (no browser captures)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: first-party-layout-pulse
          path: ${{ runner.temp }}/bronto-first-party-pulse-summary.json
          if-no-files-found: ignore
          retention-days: 30
