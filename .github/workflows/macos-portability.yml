name: macOS portability smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read

# Cancel only obsolete PR attempts of this workflow. On main and tag-triggered
# workflow_call runs, give each run an independent group; never suppress a
# release or a separate main verification attempt.
concurrency:
  group: layout-macos-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - name: Install compiler and dependencies
        run: npm ci --ignore-scripts
      - name: Static TypeScript and CLI lint checks
        run: npm run lint
      - name: Pure contracts, reports, and CLI manifest tests
        run: npm run test:unit
      - name: Pack and install into a separate npm consumer
        run: npm run test:package
      - name: Sandboxed local Chromium smoke when Chrome is installed
        shell: bash
        run: |
          if [ -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' ] || \
             [ -x '/Applications/Chromium.app/Contents/MacOS/Chromium' ]; then
            BRONTO_REQUIRE_CHROME=1 npm run test:package
          else
            echo 'No installed macOS Chrome; packaging is tested, but browser parity remains unverified.'
          fi
