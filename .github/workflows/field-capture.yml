name: Manual first-party field benchmark capture

# Explicit opt-in only. Raw screenshots are diagnostic evidence and may contain
# publicly visible content; do not schedule this or run on arbitrary URLs.
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Versioned first-party cohort (v0.1 = original 30, v0.2 = 42 with BrontoUI)'
        required: true
        type: choice
        options:
          - v0.1
          - v0.2
        default: v0.1
      full_page_evidence:
        description: 'Preserve an additional size-bounded below-fold screenshot per selected state (not a layout verdict)'
        required: false
        default: false
        type: boolean
      frame_inventory:
        description: 'Collect optional Chromium DOMSnapshot frame inventory (evidence, not inner-frame checks)'
        required: false
        default: false
        type: boolean
      ids:
        description: 'Comma-separated IDs from selected version, or all'
        required: true
        default: 'portfolio-375,sense6-ar-375'
        type: string

permissions:
  contents: read

concurrency:
  group: bronto-field-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - name: Compile and validate the field cohort
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run field:validate
      - name: Capture first-party pages on an ephemeral isolated runner
        env:
          CASE_IDS: ${{ inputs.ids }}
          FIELD_DATASET: ${{ inputs.dataset }}
          FRAME_INVENTORY: ${{ inputs.frame_inventory }}
          FULL_PAGE_EVIDENCE: ${{ inputs.full_page_evidence }}
          BRONTO_CHROME_NO_SANDBOX: '1'
        run: |
          # Chromium user namespaces are restricted on hosted CI; bypass the
          # sandbox ONLY on this disposable runner for the allowlisted public
          # first-party sites in the selected, checked-in versioned manifest.
          # Reject arbitrary paths/URLs, even when workflow caller bypasses UI choices.
          case "$FIELD_DATASET" in
            v0.1) manifest=benchmarks/field-sites.v0.1.json ;;
            v0.2) manifest=benchmarks/field-sites.v0.2.json ;;
            *) echo "::error::Unknown field dataset version" >&2; exit 2 ;;
          esac
          echo "Capturing versioned cohort: $FIELD_DATASET ($manifest)"
          args=()
          if [ "$CASE_IDS" != "all" ]; then args+=(--ids "$CASE_IDS"); fi
          if [ "$FRAME_INVENTORY" = "true" ]; then args+=(--frame-inventory); fi
          if [ "$FULL_PAGE_EVIDENCE" = "true" ]; then args+=(--full-page-evidence); fi
          node scripts/field-benchmark.mjs capture \
            --manifest "$manifest" \
            --out "reports/field-${GITHUB_RUN_ID}" "${args[@]}"
      - name: Prepare offline independent-review gallery, optional console, worksheet and blank draft
        if: always()
        shell: bash
        run: |
          dir="reports/field-${GITHUB_RUN_ID}"
          if [ -f "$dir/index.json" ]; then
            node scripts/field-benchmark.mjs review-gallery \
              --captures "$dir" --out "$dir/review-gallery.html"
            # Separate interactive tool: CSP locks its script to a source hash;
            # no networking, uploaded notes or automatic labels.
            node scripts/field-benchmark.mjs review-console \
              --captures "$dir" --out "$dir/review-console.html"
            node scripts/field-benchmark.mjs review-packet \
              --captures "$dir" --out "$dir/review-worksheet.md"
            node scripts/field-benchmark.mjs review-label-template \
              --captures "$dir" --out "$dir/review-labels-draft.json"
          else
            echo 'No capture index produced; skipping reviewer gallery.'
          fi
      - name: Preserve reports and screenshots for independent human review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bronto-layout-field-capture
          path: reports/field-*/
          if-no-files-found: warn
          retention-days: 7
