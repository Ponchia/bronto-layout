name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Node ${{ matrix.node }} + Chromium (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check browser availability
        run: |
          command -v google-chrome || command -v chromium
      - name: Typecheck, lint and execute complete test shard
        env:
          BRONTO_REQUIRE_CHROME: '1'
          BRONTO_CHROME_NO_SANDBOX: '1'
          BRONTO_TEST_INLINE_FIXTURE: '1'
        run: |
          npm run build
          npm run lint
          node scripts/ci-test-shards.mjs --shard "${{ matrix.shard }}/2"
      # The regular fixtures intentionally use a no-sandbox override on
      # ephemeral runners. This separate preflight checks that automatic
      # detection actually selects a usable sandboxed browser.
      - name: Verify default Chrome can launch without a sandbox bypass
        if: matrix.node == 22 && matrix.shard == 1
        run: |
          node bin/bronto-layout.mjs doctor --verify-launch --json | tee "$RUNNER_TEMP/chrome-preflight.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const report = JSON.parse(fs.readFileSync(
            path.join(process.env.RUNNER_TEMP, 'chrome-preflight.json'), 'utf8'
          ));
          if (report.status !== 'launch-verified' ||
              report.browser?.launch?.connected !== true ||
              report.browser?.launch?.sandboxBypassRequested !== false) {
            console.error('Automatic sandboxed Chrome launch was not verified');
            process.exit(1);
          }
          const stable = '/usr/bin/google-chrome';
          if (fs.existsSync(stable) && fs.existsSync('/usr/bin/chromium') &&
              report.browser.path !== stable) {
            console.error('Stable Chrome was not preferred over developer Chromium',
              report.browser.path);
            process.exit(1);
          }
          console.log('Verified sandboxed startup with installed browser', report.browser.path);
          NODE

      - name: Enforce portable pure-engine coverage floor
        if: matrix.node == 24 && matrix.shard == 1
        run: npm run coverage:unit
      - name: Validate proposed real-world benchmark manifest (no live network)
        if: matrix.shard == 1
        run: npm run field:validate
      - name: Verify labeled automatic-audit benchmark
        if: matrix.node == 24 && matrix.shard == 1
        env:
          # Trusted HTML fixtures on an ephemeral CI runner only.
          BRONTO_CHROME_NO_SANDBOX: '1'
        run: npm run benchmark:audit
      # v0.3 localized Chromium benchmark is the longest post-test gate.
      # Put it on the lighter second shard, keeping every benchmark required.
      - name: Verify localized controlled audit benchmark
        if: matrix.node == 24 && matrix.shard == 2
        env:
          # Local, labeled and trusted HTML fixtures only.
          BRONTO_CHROME_NO_SANDBOX: '1'
        run: npm run benchmark:audit:locations
      - name: Verify the installed npm tarball and CLI
        if: matrix.shard == 1
        env:
          BRONTO_REQUIRE_CHROME: '1'
          # Only bundled trusted fixtures run with this explicit sandbox override
          # on GitHub's ephemeral CI runner. Normal CLI use retains sandboxing.
          BRONTO_CHROME_NO_SANDBOX: '1'
        run: npm run test:package
