name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Node ${{ matrix.node }} + Chromium
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check browser availability
        run: |
          command -v google-chrome || command -v chromium
      - name: Typecheck, build and run tests
        env:
          BRONTO_REQUIRE_CHROME: '1'
          BRONTO_CHROME_NO_SANDBOX: '1'
          BRONTO_TEST_INLINE_FIXTURE: '1'
        run: npm run check
      - name: Verify labeled automatic-audit benchmark
        if: matrix.node == 24
        env:
          # Trusted HTML fixtures on an ephemeral CI runner only.
          BRONTO_CHROME_NO_SANDBOX: '1'
        run: npm run benchmark:audit
      - name: Verify expanded controlled audit benchmark
        if: matrix.node == 24
        env:
          # Local, labeled and trusted HTML fixtures only.
          BRONTO_CHROME_NO_SANDBOX: '1'
        run: npm run benchmark:audit:expanded
      - name: Verify the installed npm tarball and CLI
        env:
          BRONTO_REQUIRE_CHROME: '1'
          # Only bundled trusted fixtures run with this explicit sandbox override
          # on GitHub's ephemeral CI runner. Normal CLI use retains sandboxing.
          BRONTO_CHROME_NO_SANDBOX: '1'
        run: npm run test:package
