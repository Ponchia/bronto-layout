name: Bronto Layout
# Use a reviewed commit SHA when consuming this action from another repository.
description: Run reproducible layout contracts or a conservative audit using sandboxed Chrome, with a local JSON report
inputs:
  mode:
    description: "check for approved contracts; audit for measured browser observations"
    required: false
    default: check
  spec:
    description: "Contract path in the calling repository (required for check)"
    required: false
  url:
    description: "Local built page or running development URL; required for audit"
    required: false
  widths:
    description: "Optional comma-separated responsive widths"
    required: false
  scan:
    description: "Optional MIN:MAX:STEP instead of widths"
    required: false
  refine:
    description: "Bisect transitions after probing the requested widths (check only)"
    required: false
    default: 'false'
  interior-probes:
    description: "0..8 equally spaced interior widths per interval (check only)"
    required: false
  fail-on-skip:
    description: "Fail check if a required measurement was unavailable"
    required: false
    default: 'true'
  fail-on-coverage-gaps:
    description: "Fail audit if content is known to be uninspected"
    required: false
    default: 'false'
  report:
    description: "Local JSON report path; artifacts are NOT uploaded automatically"
    required: false
    default: reports/bronto-layout.json
outputs:
  report-path:
    description: "Absolute path to the local machine-readable report (may contain private page evidence)"
    value: ${{ steps.check.outputs.report_path }}
runs:
  using: composite
  steps:
    - name: Prepare Node 24
      uses: actions/setup-node@v7
      with:
        node-version: '24'
    - name: Build local CLI from pinned source
      shell: bash
      env:
        BRONTO_ACTION_ROOT: ${{ github.action_path }}
      run: |
        set -euo pipefail
        npm ci --prefix "$BRONTO_ACTION_ROOT" --ignore-scripts --no-audit --no-fund
        npm run build --prefix "$BRONTO_ACTION_ROOT"
    - name: Run layout verification
      id: check
      shell: bash
      env:
        BRONTO_ACTION_ROOT: ${{ github.action_path }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_SPEC: ${{ inputs.spec }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_WIDTHS: ${{ inputs.widths }}
        INPUT_SCAN: ${{ inputs.scan }}
        INPUT_REFINE: ${{ inputs.refine }}
        INPUT_INTERIOR: ${{ inputs.interior-probes }}
        INPUT_FAIL_SKIP: ${{ inputs.fail-on-skip }}
        INPUT_FAIL_COVERAGE: ${{ inputs.fail-on-coverage-gaps }}
        INPUT_REPORT: ${{ inputs.report }}
      run: |
        set -euo pipefail
        # A consumer can run more advanced CLI options directly. This small
        # action intentionally disallows shell/JS input and sandbox bypass.
        if [[ "${BRONTO_CHROME_NO_SANDBOX:-}" == "1" ]]; then
          echo '::error::Reusable action refuses BRONTO_CHROME_NO_SANDBOX=1. Keep browser sandboxing enabled.'
          exit 2
        fi
        if [[ "$INPUT_MODE" != 'check' && "$INPUT_MODE" != 'audit' ]]; then
          echo '::error::mode must be check or audit'
          exit 2
        fi
        if [[ -n "$INPUT_WIDTHS" && -n "$INPUT_SCAN" ]]; then
          echo '::error::Choose widths or scan, not both'
          exit 2
        fi
        if [[ "$INPUT_MODE" == 'check' && -z "$INPUT_SPEC" ]]; then
          echo '::error::check requires spec'
          exit 2
        fi
        if [[ "$INPUT_MODE" == 'audit' && ( -z "$INPUT_URL" || -n "$INPUT_SPEC" || -n "$INPUT_INTERIOR" || "$INPUT_REFINE" == 'true' ) ]]; then
          echo '::error::audit requires url, no spec, no interior probes and no refine'
          exit 2
        fi
        for value in "$INPUT_REFINE" "$INPUT_FAIL_SKIP" "$INPUT_FAIL_COVERAGE"; do
          if [[ "$value" != 'true' && "$value" != 'false' ]]; then
            echo '::error::Boolean action inputs must be true or false'
            exit 2
          fi
        done
        if [[ "$INPUT_MODE" == 'check' && "$INPUT_FAIL_COVERAGE" == 'true' ]]; then
          echo '::error::fail-on-coverage-gaps applies to audit only'; exit 2
        fi
        # GitHub step-output files are line-oriented: prevent output injection
        # through a caller-supplied path before echoing report_path.
        if [[ -z "$INPUT_REPORT" || "$INPUT_REPORT" == *$'\n'* || "$INPUT_REPORT" == *$'\r'* ]]; then
          echo '::error::report must be a nonempty single-line file path'
          exit 2
        fi
        # Preflight must launch a browser with the sandbox enabled. A version
        # string alone is not a meaningful check of browser usability.
        if ! node "$BRONTO_ACTION_ROOT/bin/bronto-layout.mjs" doctor --verify-launch --json > "$RUNNER_TEMP/bronto-doctor.json"; then
          echo '::error::Sandboxed Chrome/CDP launch failed. Check runner Chrome installation; no automatic --no-sandbox fallback.'
          exit 2
        fi
        args=("$INPUT_MODE" --json --compact --report "$INPUT_REPORT")
        if [[ "$INPUT_MODE" == 'check' ]]; then
          args+=(--spec "$INPUT_SPEC")
          if [[ "$INPUT_FAIL_SKIP" == 'true' ]]; then args+=(--fail-on-skip); fi
          if [[ "$INPUT_REFINE" == 'true' ]]; then args+=(--refine); fi
          if [[ -n "$INPUT_INTERIOR" ]]; then args+=(--interior-probes "$INPUT_INTERIOR"); fi
        elif [[ "$INPUT_FAIL_COVERAGE" == 'true' ]]; then
          args+=(--fail-on-coverage-gaps)
        fi
        if [[ -n "$INPUT_URL" ]]; then args+=(--url "$INPUT_URL"); fi
        if [[ -n "$INPUT_WIDTHS" ]]; then args+=(--widths "$INPUT_WIDTHS"); fi
        if [[ -n "$INPUT_SCAN" ]]; then args+=(--scan "$INPUT_SCAN"); fi
        absolute_report="$(node -e 'process.stdout.write(require("node:path").resolve(process.argv[1]))' "$INPUT_REPORT")"
        echo "report_path=$absolute_report" >> "$GITHUB_OUTPUT"
        # JSON may contain private selectors and URL paths. Store it locally;
        # never automatically print the full report or upload an artifact.
        set +e
        node "$BRONTO_ACTION_ROOT/bin/bronto-layout.mjs" "${args[@]}" > "$RUNNER_TEMP/bronto-layout-command.json" 2> "$RUNNER_TEMP/bronto-layout-command.stderr"
        status=$?
        set -e
        # Emit only summary counts, not URLs, CSS evidence or page contents.
        node - "$RUNNER_TEMP/bronto-layout-command.json" <<'NODE'
        const fs = require('node:fs');
        let data;
        try { data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')); } catch { /* runtime failed before JSON */ }
        if (data?.summary) {
          const s = data.summary;
          const labels = ['passed','failed','skipped','measuredIssues','reviewWarnings','incompleteViewports'];
          console.log('Bronto Layout evidence:', labels.filter(k => Number.isSafeInteger(s[k]))
            .map(k => `${k}=${s[k]}`).join(' '));
        }
        NODE
        # A few reviewed, machine-addressable rule IDs are useful for agents
        # without exposing raw selectors, page URLs, CSS declarations or text.
        node - "$RUNNER_TEMP/bronto-layout-command.json" <<'NODE'
        const fs = require('node:fs');
        let data;
        try { data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')); } catch { /* no valid report */ }
        for (const finding of (Array.isArray(data?.failures) ? data.failures : []).slice(0, 8)) {
          const id = typeof finding.id === 'string' && /^[a-z0-9._-]{1,64}$/i.test(finding.id)
            ? finding.id : '(unprintable-id)';
          const width = Number.isInteger(finding.width) ? finding.width : '?';
          const delta = Number.isFinite(finding.deviation) ? finding.deviation.toFixed(2) : '?';
          console.log(`Failed approved rule ${id} at ${width}px; measured deviation ${delta}`);
        }
        NODE
        if [[ "$status" -ne 0 ]]; then
          echo "::error::Bronto Layout returned exit $status. Inspect the local JSON report (handle it as private evidence)."
          exit "$status"
        fi
