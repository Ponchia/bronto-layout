<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intentional audit failures</title>
  <style>
    body { margin: 0; font: 16px system-ui }
    .wide { width: calc(100vw + 45px); height: 40px; background: #aac; }
    #clipped {
      width: 110px;
      white-space: nowrap;
      overflow-x: hidden;
      font: 16px system-ui;
    }
    .offscreen { display: none }
    #hiddenParent { visibility: hidden }
    #hiddenParent span { visibility: visible }
    #contents { display: contents }
    img { width: 120px; height: 50px }
  </style>
</head>
<body>
  <div class="wide">Oversized container</div>
  <div id="clipped">This intentionally overlong label is clipped by its own box.</div>
  <div id="contents">
    <img id="broken" src="does-not-exist.png" alt="Missing source" width="120" height="50">
  </div>
  <div id="hiddenParent"><span id="visibleChild">Visible child overriding a hidden parent</span></div>
  <div class="offscreen">
    <img src="another-missing.png" alt="Hidden image">
  </div>
</body>
</html>
