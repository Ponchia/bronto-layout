<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stable layout fixture</title>
  <style>
    body { margin: 0; font: 16px system-ui; }
    main { margin: 20px; width: 320px; }
    .header { height: 65px; }
    #placeholder { height: 265px; background: #ddd; }
    #below { width: 300px; height: 175px; background: #bbc; }
  </style>
</head>
<body>
  <main>
    <div class="header">Stable header</div>
    <div id="placeholder"></div>
    <div id="below">No movement after first paint</div>
  </main>
  <script>
    // Keep readiness timing comparable to the intentionally shifted fixture,
    // without changing geometry or generating a layout shift.
    window.addEventListener('load', () => {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        setTimeout(() => {
          requestAnimationFrame(() => requestAnimationFrame(() => {
            document.documentElement.setAttribute('data-bronto-shift-fixture-ready', 'true');
          }));
        }, 260);
      }));
    });
  </script>
</body>
</html>
