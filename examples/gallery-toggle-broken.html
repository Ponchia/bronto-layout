<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hidden grid spacing concern</title><style>
body{margin:0;padding:16px;font:16px system-ui}#cards[hidden]{display:none}#cards{display:grid;grid-template-columns:repeat(3,100px);column-gap:16px;row-gap:24px}.card{width:100px;height:70px;background:#cce}.card:nth-child(3){transform:translateX(12px)}
</style></head><body><button id="open" onclick="document.querySelector('#cards').hidden=false">Open gallery</button><section id="cards"><div class="card">A</div><div class="card">B</div><div class="card">C</div><div class="card">D</div><div class="card">E</div><div class="card">F</div></section><script>document.querySelector('#cards').hidden=true</script></body></html>
