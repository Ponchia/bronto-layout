<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visible canvas paint coverage probe</title>
  <style>
    body { margin:0; min-height:1100px; font:16px sans-serif; }
    main { padding:16px; }
    canvas { display:block; max-width:100%; width:260px; height:170px; background:#eef0f6; }
    #decorative-hidden { display:none; }
  </style>
</head>
<body>
  <main>
    <h1>Canvas surface</h1>
    <canvas id="drawing" width="260" height="170" aria-label="Decorative diagram"></canvas>
    <canvas id="decorative-hidden" width="260" height="170"></canvas>
    <p>The canvas element has a DOM rectangle but its pixels are not checked by the audit.</p>
  </main>
  <script>
    const ctx=document.getElementById('drawing').getContext('2d');
    ctx.fillStyle='#2649b8';
    ctx.fillRect(45,35,170,80);
  </script>
</body>
</html>
