<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pointer action fixture: occluded target</title>
  <style>
    body { margin:0; font:16px system-ui; }
    #open { margin:30px; width:190px; height:62px; font:inherit; }
    #panel { width:210px; padding:12px; background:#dde; }
    #blocker { position:fixed; inset:0; z-index:10; background:rgba(20,20,20,.15); }
  </style>
</head>
<body>
  <button id="open">Hidden behind a fixed overlay</button>
  <div id="blocker" aria-label="Overlay obscures the button"></div>
  <section id="panel" hidden>Interactive panel</section>
  <script>
    document.getElementById('open').addEventListener('click', event => {
      const panel = document.getElementById('panel');
      panel.hidden = false;
      panel.dataset.trusted = String(event.isTrusted);
    });
  </script>
</body>
</html>
