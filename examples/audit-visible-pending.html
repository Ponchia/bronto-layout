<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visible pending lazy image must still be a warning</title></head>
<body style="margin:0;padding:24px;min-height:1100px;font:16px system-ui">
  <img id="onscreen" src="deferred-probe.svg" loading="lazy" width="240" height="140"
       alt="Visible image whose loading is deliberately held open">
  <p>This controlled, inert fixture overrides only the observed image
  completion state to model a slow visible request deterministically.</p>
  <script>
    Object.defineProperty(document.querySelector('#onscreen'), 'complete', {
      configurable: true, get() { return false; }
    });
  </script>
</body>
</html>
