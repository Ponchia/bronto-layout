<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { margin: 0; padding: 0 }
    #card { position: absolute; left: 20px; top: 20px; width: 100px; height: 60px; background: grey }
    #alignment { position: absolute; left: 40px; top: 100px; width: 12px; height: 60px }
    @media (prefers-color-scheme: dark) { #card { width: 160px; background: black } }
    @media (prefers-reduced-motion: reduce) { #card { left: 40px } }
  </style>
</head>
<body>
  <div id="card">Visual state</div>
  <div id="alignment"></div>
</body>
</html>
