<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Delayed responsive content</title>
  <style>
    body { margin: 0; font: 16px system-ui; }
    #card { margin: 20px; width: 80px; height: 60px; background: #cad5dc; }
  </style>
</head>
<body>
  <div id="card">Expanding card</div>
  <script>
    addEventListener('load', () => {
      setTimeout(() => { document.getElementById('card').style.width = '160px'; }, 450);
    });
  </script>
</body>
</html>
