<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reconstructed Svelte REPL flex-minimum toggle regression — fixed</title>
  <style>
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; font:16px system-ui,sans-serif; }
    #app { display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
    #title { flex:none; height:58px; padding:12px 16px; background:#303942; color:white; }
    /* Based on real Svelte PR #548: .container { position:relative;flex:1;height:100%; } */
    #repl-container { position:relative; flex:1; height:100%; min-height:0;
      background:#f4f5f5; padding:0; }
    #editor { display:flex; flex-direction:column; min-height:700px;
      background:linear-gradient(180deg,#fbfbfb,#dce4e5); }
    .sample-line { padding:15px; border-bottom:1px solid #ddd; }
    #io-switch { position:absolute; bottom:0; left:0; width:100%; height:50px;
      border:0; font-weight:700; background:#6eabc1; }
  </style>
</head>
<body>
  <div id="app">
    <header id="title">Source-inspired mobile playground: input/output switch</header>
    <div id="repl-container">
      <div id="editor">
        <div class="sample-line">Editor content with a large minimum size.</div>
      </div>
      <button id="io-switch" type="button">Input / Output</button>
    </div>
  </div>
</body>
</html>
