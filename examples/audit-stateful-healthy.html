<style>html,body{margin:0}body{font:16px system-ui}button,input{margin:12px}#panel[hidden]{display:none}#panel{box-sizing:border-box;width:calc(100% - 16px);height:80px;background:#def;padding:8px}#panel img{width:48px;height:32px;object-fit:cover}</style>
</head><body>
<button id="open" onclick="document.querySelector('#panel').hidden=false">Show detail panel</button>

</body></html>
