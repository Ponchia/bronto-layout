<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pointer action fixture: offscreen target requires explicit scroll</title>
  <style>
    body { margin:0; font:16px system-ui; }
    .intro { height:1400px; }
    #open { margin:30px; width:190px; height:62px; font:inherit; }
    #panel { width:210px; padding:12px; background:#dde; }
    .footer { height:550px; }
  </style>
</head>
<body>
  <div class="intro">The button below is outside the initial viewport</div>
  <button id="open">Open a panel below the fold</button>
  <section id="panel" hidden>Interactive panel</section>
  <div class="footer"></div>
  <script>
    document.getElementById('open').addEventListener('click', event => {
      const panel = document.getElementById('panel');
      panel.hidden = false;
      panel.dataset.trusted = String(event.isTrusted);
    });
  </script>
</body>
</html>
