<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Responsive container query specimen</title>
  <link rel="stylesheet" href="container-query.css">
</head>
<body>
  <section class="card-shell" id="gallery">
    <div class="child" id="child">Changes with container width</div>
    <span class="tag">Conditional label</span>
  </section>
  <div id="shadow-host"></div>
  <script>
    const shadow = document.querySelector('#shadow-host').attachShadow({mode:'open'});
    shadow.innerHTML = '<style>.shadow-box{container-name:shadow-card;container-type:inline-size;width:320px}@container shadow-card (min-width:300px){.shadow-child{width:150px}}</style><div class="shadow-box"><div class="shadow-child">In open shadow DOM</div></div>';
  </script>
</body>
</html>
