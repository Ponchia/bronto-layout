<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Delayed layout movement fixture</title>
  <style>
    body { margin: 0; font: 16px system-ui; }
    main { margin: 20px; width: 320px; }
    .header { height: 65px; }
    #placeholder { height: 20px; background: #ddd; }
    #below { width: 300px; height: 175px; background: #bbc; }
  </style>
</head>
<body>
  <main>
    <div class="header">Stable header</div>
    <div id="placeholder"></div>
    <div id="below">Content pushed downward after first paint</div>
  </main>
  <script>
    // Wait for at least one rendered frame before changing geometry. A timer
    // fired immediately after load can run BEFORE first paint on a busy CI
    // runner, producing no Layout Instability entry despite a DOM change.
    window.addEventListener('load', () => {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        setTimeout(() => {
          document.getElementById('placeholder').style.height = '265px';
          // Let Chromium paint the changed rectangle and flush its observer
          // before the CLI's readiness selector allows measurements.
          requestAnimationFrame(() => requestAnimationFrame(() => {
            document.documentElement.setAttribute('data-bronto-shift-fixture-ready', 'true');
          }));
        }, 260);
      }));
    });
  </script>
</body>
</html>
